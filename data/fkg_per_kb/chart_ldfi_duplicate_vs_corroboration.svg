<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" width="100%" height="100%" style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #ffffff;">
  <!-- Title & Frame -->
  <rect width="800" height="320" fill="#ffffff" />
  
  <!-- Panel A Header -->
  <text x="210" y="24" font-size="13" font-weight="bold" fill="#1e293b" text-anchor="middle">(a) Same-Lineage Duplication Invariance</text>
  
  <!-- Panel A Grid & Axes -->
  <line x1="60" y1="220" x2="370" y2="220" stroke="#cbd5e1" stroke-width="1.5" />
  <line x1="60" y1="40" x2="60" y2="220" stroke="#cbd5e1" stroke-width="1.5" />
  
  <!-- Panel A Y-ticks -->
  <text x="50" y="224" font-size="10" fill="#64748b" text-anchor="end">0.0</text>
  <line x1="56" y1="220" x2="60" y2="220" stroke="#64748b" />
  <text x="50" y="166" font-size="10" fill="#64748b" text-anchor="end">0.3</text>
  <line x1="56" y1="166" x2="370" y2="166" stroke="#f1f5f9" stroke-dasharray="3,3" />
  <text x="50" y="112" font-size="10" fill="#64748b" text-anchor="end">0.6</text>
  <line x1="56" y1="112" x2="370" y2="112" stroke="#f1f5f9" stroke-dasharray="3,3" />
  <text x="50" y="58" font-size="10" fill="#64748b" text-anchor="end">0.9</text>
  <line x1="56" y1="58" x2="370" y2="58" stroke="#f1f5f9" stroke-dasharray="3,3" />
  <text x="50" y="44" font-size="10" fill="#64748b" text-anchor="end">1.0</text>
  
  <!-- Panel A X-ticks -->
  <text x="70" y="238" font-size="10" fill="#64748b" text-anchor="middle">0</text>
  <text x="128" y="238" font-size="10" fill="#64748b" text-anchor="middle">1</text>
  <text x="186" y="238" font-size="10" fill="#64748b" text-anchor="middle">2</text>
  <text x="244" y="238" font-size="10" fill="#64748b" text-anchor="middle">4</text>
  <text x="302" y="238" font-size="10" fill="#64748b" text-anchor="middle">8</text>
  <text x="360" y="238" font-size="10" fill="#64748b" text-anchor="middle">16</text>
  <text x="215" y="258" font-size="11" fill="#334155" text-anchor="middle">Number of Duplicate Copies (k)</text>
  
  <!-- Panel A Curves -->
  <polyline points="70,197.3 128,178.9 186,163.8 244,140.7 302,112.0 360,84.7" fill="none" stroke="#ef4444" stroke-width="2.5" stroke-dasharray="5,3" />
  <polyline points="70,197.3 128,197.3 186,197.3 244,197.3 302,197.3 360,197.3" fill="none" stroke="#2563eb" stroke-width="3" />
  
  <!-- Panel A Markers -->
  <circle cx="70" cy="197.3" r="4" fill="#ef4444" /><circle cx="128" cy="178.9" r="4" fill="#ef4444" /><circle cx="186" cy="163.8" r="4" fill="#ef4444" /><circle cx="244" cy="140.7" r="4" fill="#ef4444" /><circle cx="302" cy="112.0" r="4" fill="#ef4444" /><circle cx="360" cy="84.7" r="4" fill="#ef4444" />
  <circle cx="70" cy="197.3" r="4" fill="#2563eb" /><circle cx="128" cy="197.3" r="4" fill="#2563eb" /><circle cx="186" cy="197.3" r="4" fill="#2563eb" /><circle cx="244" cy="197.3" r="4" fill="#2563eb" /><circle cx="302" cy="197.3" r="4" fill="#2563eb" /><circle cx="360" cy="197.3" r="4" fill="#2563eb" />
  
  <!-- Panel A Legend -->
  <rect x="75" y="48" width="165" height="42" fill="#ffffff" fill-opacity="0.9" rx="4" stroke="#e2e8f0" />
  <line x1="85" y1="60" x2="110" y2="60" stroke="#ef4444" stroke-width="2" stroke-dasharray="4,2" />
  <circle cx="97.5" cy="60" r="3" fill="#ef4444" />
  <text x="118" y="64" font-size="10" fill="#1e293b">Naive Unrestricted μ_all</text>
  
  <line x1="85" y1="78" x2="110" y2="78" stroke="#2563eb" stroke-width="2.5" />
  <circle cx="97.5" cy="78" r="3" fill="#2563eb" />
  <text x="118" y="82" font-size="10" fill="#1e293b" font-weight="bold">LDFI (C=2) / μ_max</text>
  
  
  <!-- Panel B Header -->
  <text x="590" y="24" font-size="13" font-weight="bold" fill="#1e293b" text-anchor="middle">(b) Lineage-Disjoint Corroboration</text>
  
  <!-- Panel B Grid & Axes -->
  <line x1="440" y1="220" x2="750" y2="220" stroke="#cbd5e1" stroke-width="1.5" />
  <line x1="440" y1="40" x2="440" y2="220" stroke="#cbd5e1" stroke-width="1.5" />
  
  <!-- Panel B Y-ticks -->
  <text x="430" y="224" font-size="10" fill="#64748b" text-anchor="end">0.00</text>
  <line x1="436" y1="220" x2="440" y2="220" stroke="#64748b" />
  <text x="430" y="166" font-size="10" fill="#64748b" text-anchor="end">0.10</text>
  <line x1="436" y1="166" x2="750" y2="166" stroke="#f1f5f9" stroke-dasharray="3,3" />
  <text x="430" y="106" font-size="10" fill="#64748b" text-anchor="end">0.20</text>
  <line x1="436" y1="106" x2="750" y2="106" stroke="#f1f5f9" stroke-dasharray="3,3" />
  <text x="430" y="46" font-size="10" fill="#64748b" text-anchor="end">0.30</text>
  
  <!-- Panel B X-ticks -->
  <text x="490" y="238" font-size="10" fill="#64748b" text-anchor="middle">Q25 (0.04)</text>
  <text x="558" y="238" font-size="10" fill="#64748b" text-anchor="middle">Q50 (0.07)</text>
  <text x="626" y="238" font-size="10" fill="#64748b" text-anchor="middle">Q75 (0.10)</text>
  <text x="694" y="238" font-size="10" fill="#64748b" text-anchor="middle">Q90 (0.20)</text>
  <text x="595" y="258" font-size="11" fill="#334155" text-anchor="middle">Second Path Support s(P_2)</text>
  
  <!-- Panel B Curves -->
  <polyline points="490,138.2 558,122.2 626,77.0 694,41.3" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="4,3" />
  <polyline points="490,109.2 558,77.5 626,23.4 694,-11.3" fill="none" stroke="#16a34a" stroke-width="3" />
  
  <!-- Panel B Markers -->
  <circle cx="490" cy="138.2" r="4" fill="#64748b" /><circle cx="558" cy="122.2" r="4" fill="#64748b" /><circle cx="626" cy="77.0" r="4" fill="#64748b" /><circle cx="694" cy="41.3" r="4" fill="#64748b" />
  <circle cx="490" cy="109.2" r="4" fill="#16a34a" /><circle cx="558" cy="77.5" r="4" fill="#16a34a" /><circle cx="626" cy="23.4" r="4" fill="#16a34a" /><circle cx="694" cy="-11.3" r="4" fill="#16a34a" />
  
  <!-- Panel B Legend -->
  <rect x="455" y="48" width="180" height="42" fill="#ffffff" fill-opacity="0.9" rx="4" stroke="#e2e8f0" />
  <line x1="465" y1="60" x2="490" y2="60" stroke="#16a34a" stroke-width="2.5" />
  <circle cx="477.5" cy="60" r="3" fill="#16a34a" />
  <text x="498" y="64" font-size="10" fill="#1e293b" font-weight="bold">Disjoint Lineage (Boosted)</text>
  
  <line x1="465" y1="78" x2="490" y2="78" stroke="#64748b" stroke-width="2" stroke-dasharray="4,2" />
  <circle cx="477.5" cy="78" r="3" fill="#64748b" />
  <text x="498" y="82" font-size="10" fill="#1e293b">Shared Lineage (Rejection)</text>
</svg>